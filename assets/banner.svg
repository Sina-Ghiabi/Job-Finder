<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Job Finder</title>
  <desc id="d">Job Finder — find remote jobs, internships and master's theses across 18 countries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a38"/>
      <stop offset="1" stop-color="#16244f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3a6"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="22" fill="url(#grid)"/>
  <rect width="1280" height="340" rx="22" fill="url(#glow)"/>

  <!-- mark: a briefcase seen through a magnifier -->
  <g transform="translate(120 170)">
    <circle r="74" fill="#0b1020" stroke="url(#accent)" stroke-width="10"/>
    <path d="M52 52 L96 96" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
    <rect x="-34" y="-22" width="68" height="46" rx="8" fill="none" stroke="#e8eefc" stroke-width="7"/>
    <path d="M-14 -22 V-32 a6 6 0 0 1 6 -6 h16 a6 6 0 0 1 6 6 V-22" fill="none" stroke="#e8eefc" stroke-width="7"/>
    <path d="M-34 2 H34" stroke="#e8eefc" stroke-width="7"/>
    <rect x="-6" y="-4" width="12" height="12" rx="3" fill="url(#accent)"/>
  </g>

  <text x="250" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" fill="#f4f7ff" letter-spacing="-2">Job Finder</text>
  <rect x="254" y="190" width="150" height="6" rx="3" fill="url(#accent)"/>
  <text x="252" y="244" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#aab8dd">Remote jobs, internships and master's theses —</text>
  <text x="252" y="284" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#aab8dd">searched, filtered and scored against your résumé.</text>

  <!-- chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="936" y="60" width="270" height="44" rx="22" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="1071" y="89" text-anchor="middle" fill="#e8eefc">18 countries</text>
    <rect x="936" y="120" width="270" height="44" rx="22" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="1071" y="149" text-anchor="middle" fill="#e8eefc">LinkedIn · Indeed · Glassdoor</text>
    <rect x="936" y="180" width="270" height="44" rx="22" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="1071" y="209" text-anchor="middle" fill="#e8eefc">Screened by Claude</text>
    <rect x="936" y="240" width="270" height="44" rx="22" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="1071" y="269" text-anchor="middle" fill="#e8eefc">Windows desktop app</text>
  </g>
</svg>
