; mypy configuration for RoleHound.
;
; Run it with:   .venv\Scripts\python.exe -m mypy app
; It is also run automatically as part of `python tests/run_all.py`.
;
; The point of type checking here is NOT to satisfy a linter -- it is to catch the one
; bug family that has cost this project the most: a value that is sometimes a str,
; sometimes None, and sometimes a pandas NaN float, used as if it were always a str.
; Tests only exercise the paths they happen to run; mypy checks every path.

[mypy]
python_version = 3.8
files = app

; The single most important setting here. Without it mypy skips the BODY of any function
; that has no annotations -- which was most of this codebase -- and reports almost
; nothing while appearing to pass. With it, unannotated functions are checked too.
check_untyped_defs = True

; PySide6 ships a .pyi stub with a syntax error in it (QtGui.pyi:1073, an unexpected
; indent inside their own generated file). A stub that will not parse is FATAL -- mypy
; aborts the whole run at that line, so with site-packages stubs enabled it reports
; exactly one error and checks nothing of ours. Skipping site-packages avoids it; the
; per-library sections below then supply the ignore_missing_imports each one needs.
no_site_packages = True

; Real signal, low noise:
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True

; Deliberately NOT enabled (yet):
;   disallow_untyped_defs  -- would demand annotations on all 348 functions at once.
;   strict                 -- pulls in the above plus much more.
; Both are worth turning on incrementally, module by module, once the annotations exist.

show_error_codes = True
pretty = False

; --- third-party libraries without type information --------------------------------
; These ship no stubs (or none we can use), so their types are unknown. That is fine:
; it means mypy treats their return values as Any rather than guessing wrong.
; types-requests IS installed, but no_site_packages above hides it along with the
; unparseable PySide6 stub. requests is used only for plain get/post here, so unknown
; return types cost nothing.
[mypy-requests.*]
ignore_missing_imports = True

[mypy-apify_client.*]
ignore_missing_imports = True

; lingua is a compiled Rust extension (one 74 MB .pyd, models included) with no stub, which
; replaced langdetect for language detection -- see the measurement in app/pipeline/language.py.
[mypy-lingua.*]
ignore_missing_imports = True

[mypy-deep_translator.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

; numpy ships its own type information, which no_site_packages hides along with the
; unparseable PySide6 stub. It is used in exactly one place -- reading the match matrix out of
; rapidfuzz's cdist in _remove_duplicates_list -- so unknown types cost nothing here.
[mypy-numpy.*]
ignore_missing_imports = True

; trafilatura ships no stubs; it is also imported defensively (readable_text falls back to
; the old tag-stripping route if it is absent), so an unresolved import here is expected.
[mypy-trafilatura.*]
ignore_missing_imports = True

[mypy-bs4.*]
ignore_missing_imports = True

; rapidfuzz does ship its own type information, but no_site_packages above hides it along
; with the unparseable PySide6 stub. It is used only for two scorers returning a float
; (see _remove_duplicates_list), so unknown return types cost nothing here.
[mypy-rapidfuzz.*]
ignore_missing_imports = True

[mypy-playwright.*]
ignore_missing_imports = True

; The two readers for the résumé Sina uploads (app/resume.py). pypdf ships type information
; that no_site_packages hides; python-docx ships none. Both are used for plain text
; extraction, so unknown return types cost nothing.
[mypy-pypdf.*]
ignore_missing_imports = True

[mypy-docx.*]
ignore_missing_imports = True

# curl_cffi ships no type stubs. It is also imported defensively -- the fetch ladder drops
# two rungs and keeps working if it is absent -- so an unresolved import here is expected.
[mypy-curl_cffi.*]
ignore_missing_imports = True

; PySide6 ships .pyi stubs that mypy cannot parse -- QtGui.pyi:1073 is an indentation
; error inside PySide6's own generated stub, not in our code. Following them aborts the
; entire run at that line, so nothing else gets checked at all. Skipped rather than
; ignored: our own use of Qt is still checked, Qt's internals just come back as Any.
[mypy-PySide6.*]
follow_imports = skip
ignore_missing_imports = True
; follow_imports alone is not enough -- mypy still PARSES the stub and aborts on its
; syntax error before checking anything of ours. ignore_errors silences the file itself.
ignore_errors = True
